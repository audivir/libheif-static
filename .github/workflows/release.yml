name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            asset: macos-arm64
            target: native
            dist_dir: dist
          - os: ubuntu-latest
            asset: linux-amd64
            target: native
            dist_dir: dist
          - os: ubuntu-24.04-arm
            asset: linux-arm64
            target: native
            dist_dir: dist
          - os: windows-latest
            asset: windows-amd64
            target: native
            dist_dir: dist-windows-amd64
          - os: ubuntu-latest
            asset: windows-arm64
            target: windows-arm64
            dist_dir: dist-windows-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build meson nasm
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja meson nasm
      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja nasm pkgconfiglite -y
          pip install meson
      - shell: bash
        run: ./build.sh --target ${{ matrix.target }}
      - name: Package static libraries
        shell: bash
        run: tar -czf libheif-static-${{ matrix.asset }}.tar.gz -C ${{ matrix.dist_dir }} .
      - uses: actions/upload-artifact@v7
        with:
          name: libheif-static-${{ matrix.asset }}
          path: libheif-static-${{ matrix.asset }}.tar.gz
          retention-days: 1
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: libheif-static-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
