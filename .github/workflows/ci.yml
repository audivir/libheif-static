name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: j178/prek-action@v3.0.0
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build meson nasm
      - run: ./build.sh
      - run: ./tests/run_smoke_tests.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # x265 needs `git describe --tags` for its Windows .rc version; shallow clones have no tags.
      - name: Fetch full history for x265
        shell: bash
        run: |
          if [ "$(git -C vendor/x265 rev-parse --is-shallow-repository)" = "true" ]; then
            git -C vendor/x265 fetch --unshallow --tags
          fi
      - name: Get llvm-mingw release tag
        id: llvm-mingw-version
        shell: bash
        run: |
          RESPONSE="$(curl -sL https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest)"
          TAG="$(echo "$RESPONSE" | grep -m1 '"tag_name"' | sed -E 's/.*"tag_name": *"([^"]+)".*/\1/')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Cache llvm-mingw toolchain
        uses: actions/cache@v4
        with:
          path: .llvm-mingw
          key: llvm-mingw-${{ runner.os }}-${{ runner.arch }}-${{ steps.llvm-mingw-version.outputs.tag }}
      - name: Install build tools
        shell: pwsh
        run: |
          choco install ninja nasm pkgconfiglite -y
          pip install meson
      - shell: bash
        run: ./build.sh
      - shell: bash
        run: ./tests/run_smoke_tests.sh
